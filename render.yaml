services:
  - type: web
    name: mikrotik-telegram-render
    runtime: python
    region: frankfurt
    plan: free
    branch: render-samotech-telegram
    repo: https://github.com/NassarAlshabi1/MikroTikfinal007
    buildCommand: pip install -r telegram_bridge/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --access-logfile - telegram_bridge.render_bot:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET_TOKEN
        sync: false
      - key: MIKROTIK_ADDRESS
        sync: false
      - key: MIKROTIK_USER
        sync: false
      - key: MIKROTIK_PASSWORD
        sync: false
      - key: MIKROTIK_PORT
        value: "8728"
      - key: MIKROTIK_USE_SSL
        value: "false"
      - key: TRAFFIC_INTERFACE
        sync: false
      - key: TRAFFIC_INTERVAL_SECONDS
        value: "300"
      - key: TRAFFIC_STATE_FILE
        value: "/tmp/traffic_state.json"
      - key: MONITOR_TARGET
        value: "1.1.1.1"
      - key: MONITOR_INTERVAL_SECONDS
        value: "300"
      - key: TRAFFIC_DAILY_REPORT_TIME
        value: "23:59"
      - key: TELEGRAM_POLL_SECONDS
        value: "20"
      - key: TELEGRAM_OFFSET_FILE
        value: "/tmp/.telegram_offset"
