name: Multi-Platform Build

on:
  # البناء متعدد المنصات مكلف؛ فروع feature تعتمد على Code Quality،
  # بينما يمكن تشغيل هذا workflow يدوياً عند الحاجة.
  push:
    branches: [ main, develop, 'capy/**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:  # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Build APK (single ABI to avoid conflict with splits in build.gradle)
        run: flutter build apk --release --target-platform android-arm64

      - name: Build AAB
        run: flutter build appbundle --release --target-platform android-arm64

      - name: Upload Android artifacts
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-builds-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  build-web:
    name: Build Web (skipped — Isar Web support requires explicit validation)
    runs-on: ubuntu-latest
    # ⚠️ لا نفعّل Web هنا قبل التحقق من دعم Isar/الـplugins المستخدمة في نسخة
    if: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Build Web
        run: flutter build web --release
        # ملاحظة: --web-renderer تم إزالته في Flutter 3.10+
        # CanvasKit هو الـ renderer الافتراضي منذ Flutter 3.0

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: build/web/
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # حزم Flutter Linux الأساسية
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          # 🔒 libsecret-1-dev: مطلوب لـ flutter_secure_storage_linux
          # (لتخزين كلمات المرور بشكل آمن على Linux)
          sudo apt-get install -y libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifacts
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ github.sha }}
          path: build/linux/x64/release/bundle/
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons
        continue-on-error: true

      - name: Build Windows
        run: flutter build windows --release
        continue-on-error: true  # قد تفشل بسبب Visual Studio — لا نوقف الـ workflow

      - name: Upload Windows artifacts
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload macOS artifacts
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ github.sha }}
          path: build/macos/Build/Products/Release/
          retention-days: 14

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-web, build-linux, build-windows, build-macos]
    if: always()
    steps:
      - name: Generate build summary
        run: |
          echo "# 🚀 Multi-Platform Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Artifact policy |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|-----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Android | ${{ needs.build-android.result }} | manual/tag only |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web | ${{ needs.build-web.result }} | disabled |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux | ${{ needs.build-linux.result }} | manual/tag only |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows | ${{ needs.build-windows.result }} | manual/tag only |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS | ${{ needs.build-macos.result }} | manual/tag only |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**✨ Features:**" >> $GITHUB_STEP_SUMMARY
          echo "- Updated app icon with Qahtani logo" >> $GITHUB_STEP_SUMMARY
          echo "- Cross-platform compatibility" >> $GITHUB_STEP_SUMMARY
          echo "- Optimized builds for all platforms" >> $GITHUB_STEP_SUMMARY