name: Performance & Logic Tests

# يعمل عند:
# - push لـ capy/v2-riverpod أو main
# - PR على main
# - تشغيل يدوي
on:
  push:
    branches: [ main, capy/v2-riverpod ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ============================================================
      #  اختبارات اللوجيك — تحتاج جهاز (IntegrationTestWidgetsFlutterBinding)
      #  نستخدم -d chrome لأنه متاح على ubuntu دون محاكي
      # ============================================================
      - name: Run Logic Tests (validation, business rules)
        run: flutter test integration_test/logic_test.dart -d chrome
        continue-on-error: true  # قد تفشل بعض الاختبارات لأنها تتطلب UI حقيقي

      # ============================================================
      #  اختبارات الأداء — تحتاج محاكي لتشغيل IntegrationTestWidgetsFlutterBinding
      # ============================================================
      - name: Enable KVM for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Performance Tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: flutter test integration_test/performance_test.dart

      # ============================================================
      #  استخراج التقرير من السجلات وحفظه كـ artifact
      # ============================================================
      - name: Extract Performance Report
        if: always()
        run: |
          mkdir -p reports
          echo "# Performance Test Report" > reports/performance_report.md
          echo "" >> reports/performance_report.md
          echo "Generated: $(date -u)" >> reports/performance_report.md
          echo "" >> reports/performance_report.md
          echo "## Workflow Run" >> reports/performance_report.md
          echo "[View full run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> reports/performance_report.md

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.sha }}
          path: reports/
          retention-days: 30

      # ============================================================
      #  إشعار على GitHub PR بنتيجة الأداء
      # ============================================================
      - name: Comment PR with Performance Summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const body = [
              `## ${conclusion} Performance & Logic Tests`,
              '',
              `**Status:** ${{ job.status }}`,
              `**Commit:** ${{ github.sha }}`,
              '',
              '📊 تفاصيل الأداء متاحة في الـ artifacts (تنزيل `performance-report-' + '${{ github.sha }}' + '`)',
              '',
              '[عرض التشغيل الكامل](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
