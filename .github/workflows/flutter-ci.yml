name: Flutter CI (analyze & build)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build release APK too'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.2'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # ملاحظة: الكود الموروث (فرع controller الأصلي) يحتوي 17 تحذيرًا موجودًا مسبقًا
      # (دوال غير مستخدمة/كود ميت)، لذا نجعل التحذيرات والمعلومات غير مُفشِلة
      # مع إبقاء الأخطاء (errors) مُفشِلة للبناء.
      - name: Unit tests (محلل مدد RouterOS والحذف الذكي)
        id: unit_tests
        shell: bash
        run: |
          set +e
          flutter test test/mikrotik_duration_test.dart test/expired_users_classifier_test.dart test/cable_diagnostics_test.dart test/hotspot_logic_test.dart test/connection_errors_test.dart > test_output.txt 2>&1
          status=$?
          echo "unit_tests exit=$status"
          tail -n 40 test_output.txt
          exit $status

      - name: flutter analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_text.txt 2>&1
          status=$?
          echo "flutter analyze exit=$status"
          tail -n 60 analyze_text.txt
          exit $status

      # نُخرج الأخطاء كـ annotations قابلة للقراءة من خارج سجلات Actions
      - name: Annotate errors
        if: always()
        shell: bash
        run: |
          set +e
          echo "::notice::analyze_exit=${{ steps.analyze.outcome }}"
          grep -E "^\s*error\s+•" analyze_text.txt 2>/dev/null | head -8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "errors_total=$(grep -cE '^\s*error\s+•' analyze_text.txt 2>/dev/null || echo 0)"
          echo "warnings_total=$(grep -cE '^\s*warning\s+•' analyze_text.txt 2>/dev/null || echo 0)"
          echo "infos_total=$(grep -cE '^\s*info\s+•' analyze_text.txt 2>/dev/null || echo 0)"

      # نشر المخرجات الكاملة على فرع ci-artifacts (لسجلات Actions المحجوبة أحيانًا)
      - name: Publish analyze output to ci-artifacts branch
        if: always()
        shell: bash
        run: |
          set -e
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "analyze_step_outcome=${{ steps.analyze.outcome }}"
            echo "unit_tests_outcome=${{ steps.unit_tests.outcome }}"
            echo "===== UNIT TESTS OUTPUT (last 120 lines) ====="
            tail -n 120 test_output.txt 2>/dev/null || echo "(no test output)"
            echo "===== TOTALS ====="
            echo "errors=$(grep -cE '^\s*error\s+•' analyze_text.txt 2>/dev/null || echo 0)"
            echo "warnings=$(grep -cE '^\s*warning\s+•' analyze_text.txt 2>/dev/null || echo 0)"
            echo "infos=$(grep -cE '^\s*info\s+•' analyze_text.txt 2>/dev/null || echo 0)"
            echo "===== ERRORS ONLY ====="
            grep -E "^\s*error\s+•" analyze_text.txt 2>/dev/null || echo "(no errors)"
            echo "===== FULL OUTPUT (last 400 lines) ====="
            tail -n 400 analyze_text.txt 2>/dev/null || true
          } > analyze_bundle.txt

          rm -rf /tmp/ci_artifacts && mkdir -p /tmp/ci_artifacts && cd /tmp/ci_artifacts
          git init -q .
          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/analyze_bundle.txt" .
          git add -A
          git commit -q -m "ci: analyze output for ${GITHUB_SHA} [skip ci]"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-artifacts

  build-apk:
    name: Build release APK
    # يعمل عند الطلب اليدوي، أو عند وجود وسم [build apk] في رسالة الالتزام
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || contains(github.event.head_commit.message, '[build apk]') || startsWith(github.ref, 'refs/tags/v') }}
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.2'
          cache: true

      - run: flutter pub get
      # بناء لمعمارية الأجهزة الحديثة فقط (arm64-v8a) — ملف أصغر وأسرع تثبيتًا
      # ملاحظة: الأجهزة القديمة 32-بت (armeabi-v7a) والمحاكيات (x86_64) غير مدعومة في هذا الملف
      - name: Build APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64

      # إثبات الإصدار والمعمارية المدمجَين داخل APK، ورفض أي مكتبات 32-بت
      - name: Verify APK metadata (version + arm64 only)
        shell: bash
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then AAPT=$(ls "$SDK"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1); fi

          {
            echo "== APK metadata =="
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label|^native-code" || true
            else
              echo "(aapt not found — skipping metadata)"
            fi
            ls -lh "$APK"
          } | tee apk_version.txt
          cat apk_version.txt >> "$GITHUB_STEP_SUMMARY" || true

          if [ -n "$AAPT" ]; then
            NATIVE=$("$AAPT" dump badging "$APK" | grep "^native-code" || true)
            echo "native-code: ${NATIVE:-غير مذكور}"
            if echo "$NATIVE" | grep -q "arm64-v8a"; then
              echo "✅ arm64-v8a موجود (الأجهزة الحديثة)"
            else
              echo "::error::native-code لا يحتوي arm64-v8a"; exit 1
            fi
            if echo "$NATIVE" | grep -qE "armeabi|x86"; then
              echo "::error::APK يحتوي مكتبات 32-بت (armeabi/x86) — المطلوب arm64 فقط"; exit 1
            fi
            echo "✅ لا توجد مكتبات 32-بت — الملف للأجهزة الحديثة فقط"

            # ⚠️ بوابة حاسمة: بدون صلاحية INTERNET لا يعمل أي اتصال بالراوتر في نسخة الإصدار
            PERMS=$("$AAPT" dump permissions "$APK" 2>/dev/null || true)
            echo "== صلاحيات APK =="
            echo "$PERMS"
            if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
              echo "✅ صلاحية INTERNET موجودة في نسخة الإصدار"
            else
              echo "::error::صلاحية INTERNET غير موجودة في APK — سيفشل تسجيل الدخول على الأجهزة"
              exit 1
            fi

            # خط Cairo يجب أن يكون مضمّنًا في الحزمة (وإلا ترجع الواجهة للخط الافتراضي)
            if unzip -l "$APK" | grep -q "fonts/cairo/Cairo_400Regular.ttf"; then
              echo "✅ خط Cairo مضمّن في APK:"
              unzip -l "$APK" | grep "fonts/cairo" | awk '{print "   " $4}'
            else
              echo "::error::خط Cairo غير مضمّن في APK"
              exit 1
            fi
          fi

      # إعادة تسمية الملف باسم الإصدار ليكون التحميل واضحًا
      - name: Rename APK with version
        shell: bash
        run: |
          mkdir -p release_out
          cp build/app/outputs/flutter-apk/app-release.apk release_out/MikroNet-2.0.0.0-arm64.apk
          ls -lh release_out/

      - uses: actions/upload-artifact@v4
        with:
          name: mikronet-release-apk
          path: |
            release_out/MikroNet-2.0.0.0-arm64.apk
            apk_version.txt

      # نشر الإصدار مع ملف APK (رابط تحميل مباشر للجميع بلا حاجة لتسجيل الدخول)
      # - عند دفع وسم مثل v2.0.0.0
      # - أو عند وجود وسم [publish release] في رسالة الالتزام (لتحديث إصدار قائم،
      #   إذ إن وسوم المستودع محميّة ضد الحذف/النقل فيُحدَّث الملف المرفق بدل إنشاء وسم جديد)
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # مهم: قشرة Actions تعمل بـ -e افتراضيًا وتُنهي السكربت عند أي فشل،
          # فنُطفئها هنا لنلتقط الأخطاء ونطبعها كـ annotations بدل ابتلاعها.
          set +e
          set -o pipefail

          REPO="${{ github.repository }}"
          ASSET="release_out/MikroNet-2.0.0.0-arm64.apk"
          NAME="MikroNet-2.0.0.0-arm64.apk"
          LOCAL_SIZE=$(stat -c%s "$ASSET" 2>/dev/null)
          echo "local apk size: ${LOCAL_SIZE:-missing}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v2.0.0.0-arm64"; fi

          NOTES="إصدار MikroNet 2.0.0.0 (versionCode 2000) — للأجهزة الحديثة (arm64-v8a)

          الميزات: إدارة Hotspot كاملة (قسائم + جلسات + باقات + رفع صفحة الدخول) · حذف المستخدمين المنتهين بفحص ذكي متوافق مع RouterOS v6 و v7 · فحص الكيبل وأزواج الإيثرنت · أدوات صيانة كاملة · نسخ احتياطي واستعادة · الموزعون والمحاسبة · واجهة عربية RTL.

          \`\`\`
          $(cat apk_version.txt 2>/dev/null)
          \`\`\`

          متطلبات التثبيت: معالج ARM 64-بت (arm64-v8a) — لا يدعم الأجهزة القديمة 32-بت (armeabi-v7a) ولا المحاكيات (x86_64).

          ملاحظة: هذا الإصدار موقّع بمفتاح التصحيح (debug keystore) للاستخدام والتجربة المباشرة."

          remote_size() {
            gh api "repos/$REPO/releases/tags/$1" -q ".assets[] | select(.name==\"$NAME\") | .size" 2>/dev/null | head -1
          }

          published_tag=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            upload_log=$(gh release upload "$TAG" "$ASSET#$NAME" --clobber 2>&1)
            upload_status=$?
            echo "upload exit=$upload_status"
            echo "upload output: $upload_log"
            gh release edit "$TAG" --title "MikroNet 2.0.0.0" --notes "$NOTES" --latest >/dev/null 2>&1
            echo "edit exit=$?"

            if [ -n "$LOCAL_SIZE" ] && [ "$(remote_size "$TAG")" = "$LOCAL_SIZE" ]; then
              published_tag="$TAG"
              echo "OK: updated asset in $TAG"
            else
              echo "::warning::asset replace failed in $TAG (gh exit=$upload_status): $upload_log"
            fi
          else
            echo "release $TAG not found"
          fi

          # خطة بديلة مضمونة: إنشاء إصدار جديد بوسم جديد (المسار المُثبت عمله)
          if [ -z "$published_tag" ]; then
            NEW_TAG="v2.0.0.0-b${GITHUB_RUN_NUMBER}"
            create_log=$(gh release create "$NEW_TAG" "$ASSET#$NAME" --title "MikroNet 2.0.0.0 (build ${GITHUB_RUN_NUMBER})" --notes "$NOTES" --latest 2>&1)
            create_status=$?
            echo "create exit=$create_status output: $create_log"
            if [ "$(remote_size "$NEW_TAG")" = "$LOCAL_SIZE" ]; then
              published_tag="$NEW_TAG"
              echo "::notice::published new release $NEW_TAG"
            else
              echo "::error::release publish failed (create exit=$create_status): $create_log"
            fi
          fi

          {
            echo "### Publish summary"
            echo "- local asset size: ${LOCAL_SIZE:-missing}"
            echo "- published tag: ${published_tag:-none}"
            if [ -n "$published_tag" ]; then
              echo "- remote asset size: $(remote_size "$published_tag")"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null

          gh release list --limit 3 2>/dev/null
          exit 0
