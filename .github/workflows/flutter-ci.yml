name: Flutter CI (analyze & build)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build release APK too'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.2'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # ملاحظة: الكود الموروث (فرع controller الأصلي) يحتوي 17 تحذيرًا موجودًا مسبقًا
      # (دوال غير مستخدمة/كود ميت)، لذا نجعل التحذيرات والمعلومات غير مُفشِلة
      # مع إبقاء الأخطاء (errors) مُفشِلة للبناء.
      - name: Unit tests (محلل مدد RouterOS والحذف الذكي)
        id: unit_tests
        shell: bash
        run: |
          set +e
          flutter test test/mikrotik_duration_test.dart test/expired_users_classifier_test.dart > test_output.txt 2>&1
          status=$?
          echo "unit_tests exit=$status"
          tail -n 40 test_output.txt
          exit $status

      - name: flutter analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_text.txt 2>&1
          status=$?
          echo "flutter analyze exit=$status"
          tail -n 60 analyze_text.txt
          exit $status

      # نُخرج الأخطاء كـ annotations قابلة للقراءة من خارج سجلات Actions
      - name: Annotate errors
        if: always()
        shell: bash
        run: |
          set +e
          echo "::notice::analyze_exit=${{ steps.analyze.outcome }}"
          grep -E "^\s*error\s+•" analyze_text.txt 2>/dev/null | head -8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "errors_total=$(grep -cE '^\s*error\s+•' analyze_text.txt 2>/dev/null || echo 0)"
          echo "warnings_total=$(grep -cE '^\s*warning\s+•' analyze_text.txt 2>/dev/null || echo 0)"
          echo "infos_total=$(grep -cE '^\s*info\s+•' analyze_text.txt 2>/dev/null || echo 0)"

      # نشر المخرجات الكاملة على فرع ci-artifacts (لسجلات Actions المحجوبة أحيانًا)
      - name: Publish analyze output to ci-artifacts branch
        if: always()
        shell: bash
        run: |
          set -e
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "analyze_step_outcome=${{ steps.analyze.outcome }}"
            echo "unit_tests_outcome=${{ steps.unit_tests.outcome }}"
            echo "===== UNIT TESTS OUTPUT (last 120 lines) ====="
            tail -n 120 test_output.txt 2>/dev/null || echo "(no test output)"
            echo "===== TOTALS ====="
            echo "errors=$(grep -cE '^\s*error\s+•' analyze_text.txt 2>/dev/null || echo 0)"
            echo "warnings=$(grep -cE '^\s*warning\s+•' analyze_text.txt 2>/dev/null || echo 0)"
            echo "infos=$(grep -cE '^\s*info\s+•' analyze_text.txt 2>/dev/null || echo 0)"
            echo "===== ERRORS ONLY ====="
            grep -E "^\s*error\s+•" analyze_text.txt 2>/dev/null || echo "(no errors)"
            echo "===== FULL OUTPUT (last 400 lines) ====="
            tail -n 400 analyze_text.txt 2>/dev/null || true
          } > analyze_bundle.txt

          rm -rf /tmp/ci_artifacts && mkdir -p /tmp/ci_artifacts && cd /tmp/ci_artifacts
          git init -q .
          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/analyze_bundle.txt" .
          git add -A
          git commit -q -m "ci: analyze output for ${GITHUB_SHA} [skip ci]"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-artifacts

  build-apk:
    name: Build release APK
    # يعمل عند الطلب اليدوي، أو عند وجود وسم [build apk] في رسالة الالتزام
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || contains(github.event.head_commit.message, '[build apk]') }}
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.2'
          cache: true

      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mikronet-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
