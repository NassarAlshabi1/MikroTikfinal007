name: Flutter CI (analyze & build)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build release APK too'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.2'
          cache: true
      - name: flutter pub get
        run: flutter pub get
      # ملاحظة: الكود الموروث (فرع controller الأصلي) يحتوي تحذيرات موجودة مسبقًا،
      # لذا نجعل التحذيرات والمعلومات غير مُفشِلة مع إبقاء الأخطاء مُفشِلة للبناء.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: dart format check (report only)
        run: dart format --output=none --set-exit-if-changed lib || true

  build-apk:
    name: Build release APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.2'
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mikronet-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
