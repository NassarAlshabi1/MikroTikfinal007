name: Flutter Android Emulator Integration Test

# يعمل الاختبار تلقائياً عند:
# - رفع الكود لفرع main
# - رفع الكود لفرع capy/v2-riverpod (فرع التطوير الحالي)
# - فتح PR على main
on:
  push:
    branches: [ main, capy/v2-riverpod ]
  pull_request:
    branches: [ main ]
  # يسمح بتشغيل يدوي من تبويب Actions
  workflow_dispatch:

jobs:
  android-emulator-test:
    runs-on: ubuntu-latest  # خوادم لينكس تدعم تسريع المحاكي
    timeout-minutes: 30     # حد أقصى لمنع التعليق

    steps:
      # 1. سحب الكود من مستودع GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد لغة Java المطلوبة لتشغيل بيئة الأندرويد
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد وتثبيت Flutter
      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true   # تسريع البناء بإعادة استخدام cache

      # 4. التحقق من تثبيت Flutter وعرض الإصدار
      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      # 5. تحميل مكاتب وحزم المشروع
      - name: Install Dependencies
        run: flutter pub get
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      # 6. فحص جودة الكود (سريع — قبل تشغيل المحاكي)
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 7. تفعيل صلاحيات تسريع محاكي الأندرويد داخل خادم GitHub
      # مهم جداً للسرعة — بدونها المحاكي بطيء جداً أو يفشل
      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 8. تشغيل المحاكي السحابي وتنفيذ اختبارات الواجهة
      - name: Run Integration Tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33        # إصدار الأندرويد (Android 13)
          target: google_apis  # لدعم خدمات جوجل
          arch: x86_64         # معمارية سريعة ومتوافقة مع الخوادم
          profile: pixel_5     # ملف جهاز محدد لنتائج مستقرة
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true  # تعطيل الحركات لاستقرار الاختبارات
          script: flutter test integration_test/app_test.dart

      # 9. رفع تقارير الـ screenshots والسجلات عند الفشل
      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            build/reports/
            integration_test/screenshots/
          retention-days: 7
