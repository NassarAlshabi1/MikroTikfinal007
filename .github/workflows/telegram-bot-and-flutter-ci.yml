name: Telegram Bot and Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram-bot:
    name: Telegram Bot Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        run: python -m pip install --disable-pip-version-check -r telegram_bot/requirements.txt

      - name: Compile bot package
        run: python -m compileall -q telegram_bot

      - name: Run bot tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Validate installer and workflow syntax markers
        run: bash -n scripts/setup_telegram_bot_local.sh

      - name: Validate RouterOS Telegram templates and reject real secrets
        shell: bash
        run: |
          test ! -e android/key.properties
          test ! -e android/app/release-keystore.jks
          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '.env' -o -name 'bridge.env' \) -not -path './.git/*' | grep -q .; then
            echo 'Signing or environment artifact found in repository.'
            exit 1
          fi
          test -f deploy/routeros/telegram-direct-bot-v6.rsc.example
          test -f deploy/routeros/telegram-direct-usermanager-v6.rsc.example
          grep -q 'REPLACE_WITH_NEW_BOT_TOKEN' deploy/routeros/telegram-direct-bot-v6.rsc.example
          grep -q 'REPLACE_WITH_NEW_BOT_TOKEN' deploy/routeros/telegram-direct-usermanager-v6.rsc.example
          grep -q 'REPLACE_WITH_USER_MANAGER_CUSTOMER' deploy/routeros/telegram-direct-usermanager-v6.rsc.example
          grep -q 'REPLACE_WITH_USER_MANAGER_PROFILE' deploy/routeros/telegram-direct-usermanager-v6.rsc.example
          if grep -RInE 'api\.telegram\.org/bot[0-9]{6,}:|TG_BOT_TOKEN[[:space:]]+"[^R]' deploy/routeros --include='*.rsc' --include='*.md'; then
            echo 'A real Telegram bot token appears in RouterOS deployment files.'
            exit 1
          fi

  flutter:
    name: Flutter analyze, tests, and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          ansi_escape = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          diagnostic = re.compile(
              r"^\s*(error|warning|info)\s+•\s+(.*?)\s+•\s+(.+?):(\d+):(\d+)\s+•\s+(\S+)\s*$"
          )

          def escape_property(value):
              return (value.replace("%", "%25").replace("\r", "%0D")
                      .replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C"))

          def escape_data(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for raw_line in Path("/tmp/flutter-analyze.log").read_text().splitlines():
              line = ansi_escape.sub("", raw_line)
              match = diagnostic.match(line)
              if not match:
                  continue
              severity, message, path, line_number, column, code = match.groups()
              level = {"error": "error", "warning": "warning", "info": "notice"}[severity]
              message = escape_data(f"{message} ({code})")
              print(
                  f"::{level} file={escape_property(path)},line={line_number},"
                  f"col={column},title=Dart analyzer::{message}"
              )
          PY
          exit "$analyze_status"

      - name: Test
        run: flutter test

      - name: Debug APK build
        run: flutter build apk --debug
