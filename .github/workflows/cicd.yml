name: CICD Pipeline

# ============================================================
#  CICD شامل — مستوحى من clark-ewerton/mobile-test-automation-lab
#  يغطّي: تحليل الكود + اختبارات على محاكي + تقارير Allure + نشر على GitHub Pages
# ============================================================

on:
  push:
    branches: [ main, capy/v2-riverpod ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # ===== Flutter / Java =====
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

  # ===== Android Emulator =====
  ANDROID_API_LEVEL: '33'
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64
  ANDROID_PROFILE: pixel_5

  # ===== Artifacts =====
  ARTIFACT_NAME_TEST_RESULTS: flutter-test-results
  ARTIFACT_NAME_APK: release-apk
  ARTIFACT_NAME_ALLURE: allure-results
  GH_PAGES_URL: https://nassaralshabi.github.io/MikroTikfinal007

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  #  Job 1: تحليل الكود + البناء
  # ============================================================
  analyze-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.build.outcome }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build release APK (arm64)
        id: build
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --split-debug-info=build/symbols \
            --tree-shake-icons

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME_APK }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  #  Job 2: اختبارات التكامل على محاكي Android
  # ============================================================
  run-integration-tests:
    runs-on: ubuntu-latest
    needs: analyze-and-build
    outputs:
      tests_status: ${{ steps.tests.outcome }}
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME_APK }}
          path: build/app/outputs/flutter-apk/

      - name: Run integration tests on Android emulator
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # تشغيل اختبارات التكامل مع تقرير JSON
            flutter test integration_test/app_test.dart \
              --machine \
              --reporter expanded \
              > test_output.jsonl 2>&1 || true

            # تحويل JSONL إلى تنسيق Allure (حفظ النتائج الخام)
            mkdir -p allure-results
            python3 -c "
            import json, os, uuid, time
            results = []
            try:
                with open('test_output.jsonl', 'r') as f:
                    for line in f:
                        line = line.strip()
                        if not line: continue
                        try:
                            event = json.loads(line)
                            if event.get('type') == 'testDone':
                                test = event.get('test', {})
                                result = event.get('result', '')
                                status = 'passed' if result == 'success' else 'failed'
                                results.append({
                                    'name': test.get('name', 'unknown'),
                                    'status': status,
                                    'uuid': str(uuid.uuid4()),
                                    'start': int(time.time() * 1000),
                                    'stop': int(time.time() * 1000),
                                    'labels': [{'name': 'suite', 'value': test.get('suite', 'default')}],
                                })
                        except: pass
            except: pass

            for r in results:
                with open(f'allure-results/{r[\"uuid\"]}-result.json', 'w') as f:
                    json.dump(r, f, indent=2)
            print(f'Generated {len(results)} allure results')
            "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME_ALLURE }}
          path: |
            allure-results/
            test_output.jsonl
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  #  Job 3: اختبارات الأداء (Performance Tests)
  # ============================================================
  run-performance-tests:
    runs-on: ubuntu-latest
    needs: analyze-and-build
    outputs:
      perf_status: ${{ steps.perf.outcome }}
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build

      - name: Run performance tests
        id: perf
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            flutter test integration_test/performance_test.dart \
              --machine \
              > perf_output.jsonl 2>&1 || true

            mkdir -p allure-results-perf
            python3 -c "
            import json, uuid, time
            results = []
            try:
                with open('perf_output.jsonl', 'r') as f:
                    for line in f:
                        line = line.strip()
                        if not line: continue
                        try:
                            event = json.loads(line)
                            if event.get('type') == 'testDone':
                                test = event.get('test', {})
                                result = event.get('result', '')
                                status = 'passed' if result == 'success' else 'failed'
                                results.append({
                                    'name': '[PERF] ' + test.get('name', 'unknown'),
                                    'status': status,
                                    'uuid': str(uuid.uuid4()),
                                    'start': int(time.time() * 1000),
                                    'stop': int(time.time() * 1000),
                                })
                        except: pass
            except: pass
            for r in results:
                with open(f'allure-results-perf/{r[\"uuid\"]}-result.json', 'w') as f:
                    json.dump(r, f, indent=2)
            "

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-perf
          path: |
            allure-results-perf/
            perf_output.jsonl
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  #  Job 4: توليد ونشر تقرير Allure
  # ============================================================
  deploy-report:
    if: always()
    name: Generate and deploy Allure Report
    needs: [run-integration-tests, run-performance-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Download artifacts - Integration Tests
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME_ALLURE }}
          path: target/allure-results

      - name: Download artifacts - Performance Tests
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: allure-results-perf
          path: target/allure-results

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history

      - name: Post reports link as status check
        if: always()
        uses: Sibz/github-status-action@v1
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: '🧪 Test Report (Allure)'
          state: ${{ needs.run-integration-tests.outputs.tests_status == 'success' && 'success' || 'failure' }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          target_url: ${{ env.GH_PAGES_URL }}/${{ github.run_number }}/

      - name: Post build status
        if: always()
        uses: Sibz/github-status-action@v1
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: '📦 APK Build'
          state: ${{ needs.run-integration-tests.needs.analyze-and-build.outputs.build_status == 'success' && 'success' || 'failure' }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          target_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
