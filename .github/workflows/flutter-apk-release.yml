name: Build Flutter Release APK

on:
  push:
    branches:
      - 'capy/v2-riverpod'
      - 'main'
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # ===== بناء للأجهزة الحديثة فقط (arm64-v8a) =====
      # يدعم: Android 5.0+ (API 21) على معالجات 64-bit
      # يشمل الغالبية العظمى من الأجهزة المُنتجة بعد 2014
      # النتيجة: APK أصغر بـ ~40% من البناء المتعدد المعماري
      - name: Build release APK (arm64-v8a only - modern 64-bit devices)
        run: flutter build apk --release --target-platform android-arm64

      - name: Show APK info
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk
          echo "---"
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-manager-release-apk-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
