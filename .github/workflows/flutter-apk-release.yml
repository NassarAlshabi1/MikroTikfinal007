name: Build Flutter Release APK

on:
  pull_request:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-apk-release.yml'
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # تتطلب الاعتمادات الحالية وColor.withValues إصدار Flutter حديثاً.
          # تم التحقق محلياً من pub get وanalyze وtest باستخدام 3.47.0.
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean build artifacts
        run: flutter clean

      - name: Build split release APKs by ABI
        run: flutter build apk --release --split-per-abi

      - name: Upload ARMv8 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-manager-arm64-v8a-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
