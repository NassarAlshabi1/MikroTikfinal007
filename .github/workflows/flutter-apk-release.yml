name: Build Flutter Release APK

on:
  push:
    branches:
      - 'capy/v2-riverpod'
      - 'main'
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # لا نستخدم flutter clean لأنه يُبطئ البناء ويلغي cache الـ dependencies
      # - name: Clean build artifacts
      #   run: flutter clean

      - name: Build release APK (arm64 + armv7 for broad device support)
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-manager-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
