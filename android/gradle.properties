org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

android.useAndroidX=true
android.enableJetifier=false

# ===== R8 تحسينات (أهم خطوة لتقليل الحجم) =====
android.enableR8.fullMode=true
android.enableR8.libraries=true

# تسريع البناء
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=36

# ===== تقليل حجم الـ APK =====
# ملاحظة: لا نعطّل buildConfig لأن build.gradle يستخدم buildConfigField
# إزالة resValues من المكتبات (يقلل الكود المُجمّع)
android.defaults.buildfeatures.resvalues=false
# تعطيل Aidl و RenderScript (غير مستخدمة)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
# تعطيل Shader Compiler (غير مستخدم)
android.defaults.buildfeatures.shaders=false

# إزالة ML Kit model preloading (يقلل حجم الـ startup)
# (تم إزالة enablePrefab لأنه deprecated منذ AGP 4.1)
