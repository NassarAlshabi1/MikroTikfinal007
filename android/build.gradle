buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                compileSdkVersion 36
                if (namespace == null) {
                    // إصلاح: isar_flutter_libs 3.1.0+1 لا يحدد namespace
                    // في build.gradle بل في AndroidManifest.xml (deprecated)
                    // نضيفه هنا تلقائياً لكل plugin يفتقر إليه
                    if (project.name == 'isar_flutter_libs') {
                        namespace = "dev.isar.isar_flutter_libs"
                    } else {
                        namespace = "com.mikrotik.${project.name.toLowerCase()}"
                    }
                }
            }
            // إصلاح: إزالة package attribute من AndroidManifest.xml للـ plugins القديمة
            // (isar_flutter_libs 3.1.0+1 تستخدم package= في الـ manifest، وهو deprecated)
            project.tasks.withType(com.android.build.gradle.tasks.ProcessLibraryManifest).configureEach {
                doFirst {
                    if (inputs.files.files.any { it.name == 'AndroidManifest.xml' }) {
                        inputs.files.files.each { f ->
                            if (f.name == 'AndroidManifest.xml' && f.exists()) {
                                def content = f.text
                                if (content.contains('package="dev.isar.isar_flutter_libs"')) {
                                    f.text = content.replaceAll('package="dev.isar.isar_flutter_libs"', '')
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}