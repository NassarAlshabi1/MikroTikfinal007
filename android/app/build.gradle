plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ═══ مفتاح التوقيع الموحّد ═══
// كل بناء (CI أو محلي) يُوقَّع بنفس المفتاح ⇒ تُثبَّت النسخة الجديدة فوق القديمة
// مباشرة بلا رسالة «تعارض الحزمة/لم يتم تثبيت التطبيق».
// الأولوية: android/key.properties (خاص، مُتجاهَل في git) ثم android/signing.properties (المشترك).
def signingProps = new Properties()
def signingPropsFile = rootProject.file('key.properties')
if (!signingPropsFile.exists()) {
    signingPropsFile = rootProject.file('signing.properties')
}
def hasSigningProps = signingPropsFile.exists()
if (hasSigningProps) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {
    namespace = "com.miknet.marina"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.miknet.marina"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // رقم البناء (versionCode) من pubspec.yaml، ويُرفع تلقائيًا مع كل إصدار
        // (البناء المحلي: flutter build apk --build-name=... --build-number=...)
        versionCode = flutter.versionCode
        // الاسم الظاهر للإصدار من pubspec.yaml — ويُتجاوَز بـ--build-name عند البناء
        // (CI يرفعه تلقائيًا: 2.0.0.<رقم البناء> مع versionCode = 2000 + الرقم)
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasSigningProps) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // التوقيع بالمفتاح الموحّد إن توفّر، وإلا يبقى توقيع التصحيح (تطوير فقط)
            signingConfig = hasSigningProps ? signingConfigs.release : signingConfigs.debug
            if (!hasSigningProps) {
                println "⚠️  تحذير: لم يُعثر على android/signing.properties — سيُوقَّع الإصدار بمفتاح التصحيح ولن يُثبَّت فوق النسخ المنشورة."
            }
        }
    }
}

flutter {
    source = "../.."
}
