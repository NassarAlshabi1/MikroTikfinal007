// ============================================================
//  build.gradle (Groovy) — محسّن لأصغر حجم APK ممكن
//  كل تقنيات تقليل الحجم مُفعّلة
// ============================================================

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.mikrotik.manager"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xno-param-assertions', '-Xno-call-assertions']
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.mikrotik.manager"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // ===== لا نضع abiFilters في defaultConfig عند استخدام splits =====
        // splits.abi سيتكفّل بالفصل
        vectorDrawables {
            useSupportLibrary = true
        }

        // تجاهل حزم اللغات غير المستخدمة (Fluter يدعم 78 لغة افتراضياً)
        // نُبقي العربية والإنجليزية فقط
        resConfigs 'ar', 'en'
    }

    // ===== تفعيل buildConfig (مطلوب لـ buildConfigField) =====
    buildFeatures {
        buildConfig true
    }

    // ===== لا نستخدم splits.abi هنا =====
    // Flutter يضيف abiFilters افتراضياً التي تتعارض مع splits.abi
    // بدلاً من ذلك نستخدم --target-platform + --split-per-abi في flutter build
    // هذا يعطي نفس النتيجة (APK منفصل لكل معمارية) بدون تعارض

    // ============================================================
    // Release signing resolution order:
    //   1) Environment variables (CI / local secret manager)
    //   2) android/key.properties (personal-use documented in SIGNING.md)
    // If neither source provides full credentials, release builds
    // fail closed (no unsigned APK).
    // ============================================================
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('key.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withReader('UTF-8') { keystoreProps.load(it) }
    }

    def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH') ?: keystoreProps['storeFile']
    def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProps['keyAlias']
    def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProps['keyPassword']
    def releaseStorePassword = System.getenv('ANDROID_STORE_PASSWORD') ?: keystoreProps['storePassword']
    def releaseSigningConfigured = [releaseStoreFile, releaseKeyAlias, releaseKeyPassword, releaseStorePassword].every { value -> value != null && !value.trim().isEmpty() } && file(releaseStoreFile).isFile()
    def requestedReleaseTask = gradle.startParameter.taskNames.any { task ->
        task.toLowerCase(Locale.ROOT).contains('release')
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "Boolean", "DEBUG_MODE", "false"

            // ===== التوقيع إلزامي للإصدار ولا يجوز استخدام unsigned APK =====
            if (!releaseSigningConfigured && requestedReleaseTask) {
                throw new GradleException('Release signing secrets are missing; provide ANDROID_KEYSTORE_PATH, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD outside Git.')
            }
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "Boolean", "DEBUG_MODE", "true"
        }

        profile {
            minifyEnabled false
            shrinkResources false
            buildConfigField "Boolean", "DEBUG_MODE", "false"
        }
    }

    // ===== إزالة الملفات غير الضرورية من APK =====
    packagingOptions {
        // ملفات META-INF مكررة بين المكتبات
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/versions/**'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude 'META-INF/io.netty.versions.properties'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/MANIFEST.MF'

        // ملفات ProGuard المُدمجة من المكتبات
        exclude 'META-INF/proguard/**'

        // ملفات ترخيص Mentor Graphics (من PDF libraries)
        exclude 'META-INF/maven/**'
        exclude 'about_files/**'
        exclude 'about.html'
        exclude 'plugin.properties'
        exclude 'OSGI-INF/**'

        // ضغط الموارد غير المضغوطة (يقلل الحجم)
        jniLibs {
            useLegacyPackaging false  // يستخرج .so من APK (أصغر)
        }
    }
}

flutter {
    source '../..'
    // تمرير --split-debug-info لفصل debug symbols عن APK
    // يقلل حجم APK بشكل كبير جداً (~20-40%)
    // لكنه يتطلب تخزين الـ symbols لإعادة الـ stack traces
}

dependencies {}

// ============================================================
//  ترقيم تلقائي (Auto-Version)
//  يزيد رقم البناء (+N) في pubspec.yaml تلقائياً بعد كل بناء إصدار.
//  مثال: 1.0.0+1  →  1.0.0+2  →  1.0.0+3 ...
//  يعمل مع: flutter build apk / appbundle (assembleRelease / bundleRelease)
//  ملاحظة: البناء الحالي يستخدم الرقم الحالي، ثم يُرفَع الرقم للبناء التالي.
// ============================================================
def bumpPubspecBuildNumber = {
    def pubspec = rootProject.file('../pubspec.yaml')
    if (!pubspec.exists()) {
        println "⚠️ [auto-version] لم أجد pubspec.yaml"
        return
    }
    def text = pubspec.text
    def matcher = (text =~ /(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$/)
    if (matcher.find()) {
        def base = matcher.group(1)
        def next = matcher.group(2).toInteger() + 1
        def replacement = java.util.regex.Matcher.quoteReplacement("version: ${base}+${next}")
        def updated = text.replaceFirst(/(?m)^version:\s*\d+\.\d+\.\d+\+\d+\s*$/, replacement)
        pubspec.write(updated, 'UTF-8')
        println "🔼 [auto-version] رقم البناء أصبح ${base}+${next}"
    } else {
        println "⚠️ [auto-version] صيغة version غير متوقعة (المطلوب: x.y.z+N)"
    }
}

// نربط الترقيم بمهام بناء الإصدار فقط (لا يُزعج بناء debug أثناء التطوير)
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name == 'assembleRelease' || task.name == 'bundleRelease') {
            task.doLast {
                bumpPubspecBuildNumber()
            }
        }
    }
}
