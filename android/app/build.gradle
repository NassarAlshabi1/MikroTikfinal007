// ============================================================
//  build.gradle (Groovy) — المُستخدم من قبل Flutter فعلياً
//  مُحدّث بكل تحسينات الأداء للأجهزة الضعيفة
// ============================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.example.mikrotik_manager"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.mikrotik_manager"
        minSdk 21
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // دعم الأجهزة القديمة 32-bit + الحديثة 64-bit
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    // فصل APK لكل معمارية → تنزيل أصغر بكثير على كل جهاز
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true  // APK موحد كخيار احتياطي
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug

            // ===== تحسينات R8 / ProGuard (الأهم للأجهزة الضعيفة) =====
            minifyEnabled true       // إزالة الكود الميت
            shrinkResources true     // إزالة الموارد غير المستخدمة
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // =========================================================

            // خصائص الـ Build للإصدار
            buildConfigField "Boolean", "DEBUG_MODE", "false"
        }

        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "Boolean", "DEBUG_MODE", "true"
        }

        profile {
            minifyEnabled false
            shrinkResources false
            buildConfigField "Boolean", "DEBUG_MODE", "false"
        }
    }

    // تسريع البناء — إزالة ملفات META-INF المكررة
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/versions/**'
    }
}

flutter {
    source '../..'
}

dependencies {}
