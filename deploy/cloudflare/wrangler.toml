name = "mikrotik-telegram-bot"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespaces for configuration and user data
[[kv_namespaces]]
binding = "CONFIG"
id = "93f3a5feb19942c9bda92b91c502908b"

[[kv_namespaces]]
binding = "USER_DATA"
id = "b45ed7424cb3438180a7085f435ab83a"

# Environment variables (can also be set in Cloudflare dashboard)
[vars]
ENVIRONMENT = "production"

# For local development
[dev]
port = 8787

# Routes (optional - configure in Cloudflare dashboard)
# [triggers]
# crons = ["*/5 * * * *"]
